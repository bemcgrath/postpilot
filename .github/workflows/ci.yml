name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  core:
    name: "@postpilot/core (test, typecheck, chrome-free check)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      # Root-level install: npm workspaces need this to symlink
      # @postpilot/core into apps/extension/node_modules.
      - run: npm ci

      - name: Test
        run: npm test --workspace=packages/core

      - name: Typecheck
        run: npm run typecheck --workspace=packages/core

      # The actual enforcement point for the "pure core" invariant this repo
      # depends on (see the mobile plan's "What already ports" section) --
      # grepping the built score-widget bundle only proves the bundler
      # tree-shook unused code, not that the source itself has no chrome/DOM
      # dependency. This greps the source directly.
      #
      # Excludes packages/core/src/storage/: that's the platform-adapter
      # layer, whose entire job is to safely *detect* chrome.storage when
      # present (guarded by typeof checks) and no-op otherwise -- it's meant
      # to reference chrome.*, the same way it's meant to eventually gain an
      # MMKV-based mobile counterpart. The invariant this check actually
      # protects is that scoring/learning computation stays chrome-free.
      - name: Assert packages/core's scoring/learning stays chrome-and-DOM-free
        run: |
          if grep -rEq "chrome\.(storage|runtime)|document\.(querySelector|getElementById|createElement)|window\.(location|getComputedStyle)" --include="*.ts" packages/core/src/scoring packages/core/src/learning packages/core/src/config packages/core/src/rewrite packages/core/src/drafts packages/core/src/hooks; then
            echo "packages/core's scoring/learning/config/rewrite code references a browser-extension or DOM API -- the pure scoring core has picked up a dependency it shouldn't have."
            exit 1
          fi
          echo "OK: packages/core's scoring/learning/config/rewrite has no chrome.*/DOM API references."

  extension:
    name: Extension (test, typecheck, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - run: npm ci

      - name: Test
        run: npm test --workspace=apps/extension

      - name: Typecheck
        run: npm run typecheck --workspace=apps/extension

      - name: Build extension
        run: npm run build --workspace=apps/extension

      - name: Build score widget
        run: npm run build:score

      # Same invariant as the core job's check, verified end-to-end through
      # the actual esbuild output every user's browser would load.
      - name: Assert the score widget bundle stays chrome-free
        run: |
          if grep -qE "chrome\.(storage|runtime)|document\.(querySelector|getElementById|createElement)|window\.(location|getComputedStyle)" score/postpilot-score.bundle.js; then
            echo "score/postpilot-score.bundle.js references a browser-extension or DOM API -- the pure scoring core has picked up a dependency it shouldn't have."
            exit 1
          fi
          echo "OK: score widget bundle has no chrome.*/DOM API references."

  mobile:
    name: Mobile (test, typecheck, export)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - run: npm ci

      - name: Test
        run: npm test --workspace=apps/mobile

      - name: Typecheck
        run: npm run typecheck --workspace=apps/mobile

      # Bundles the JS/TS graph without building native code -- proves Metro
      # actually resolves @postpilot/core through the workspace symlink (and
      # its package.json exports map) at real bundle time, the mobile
      # equivalent of the extension job's `plasmo build` check. Does not
      # exercise anything native-module-specific (MMKV, etc.) -- that needs
      # a real device or a dev-client build, which CI can't do here.
      #
      # Android, not iOS: this app ships Android-only for now (no Apple
      # Developer account yet), and app.json's expo-share-intent plugin
      # config sets disableIOS: true -- an iOS export wouldn't exercise the
      # real plugin config anyway.
      - name: Export (bundle check)
        working-directory: apps/mobile
        run: npx expo export --platform android

  worker:
    name: Worker (test, typecheck)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: worker/package-lock.json

      - run: npm ci

      - name: Test
        run: npm test

      - name: Typecheck
        run: npm run typecheck
