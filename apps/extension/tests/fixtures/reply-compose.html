<!DOCTYPE html>
<html>
<body>
  <div role="dialog" class="reply-dialog">
    <article data-testid="tweet">
      <div data-testid="tweetText">Parent with a photo</div>
      <div data-testid="tweetPhoto">
        <img alt="parent photo" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///ywAAAAAAQABAAACAUwAOw==" />
      </div>
      <div data-testid="card.wrapper">https://example.com</div>
      <video></video>
    </article>
    <div class="compose">
      <img alt="Your avatar" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///ywAAAAAAQABAAACAUwAOw==" />
      <div data-testid="tweetTextarea_0">
        <div contenteditable="true">A text-only reply <img alt="🔥" draggable="false" src="https://abs-0.twimg.com/emoji/v2/svg/1f525.svg" /></div>
      </div>
      <div data-testid="attachments">
        <img alt="Your avatar" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///ywAAAAAAQABAAACAUwAOw==" />
      </div>
      <div data-testid="toolBar">
        <button data-testid="tweetButton">Reply</button>
      </div>
    </div>
  </div>
</body>
</html>
